 spring:
   cloud:
     openfeign:
       client:
         config:
           qi-suo-file:
             read-timeout: 2000
             connect-timeout: 2000
             logger-level: full
             retryer: feign.Retryer.Default

 qi-suo:
   log:
     consumer-enabled: true
     batch-size: 10
     batch-receive-timeout-ms: 1000
     prefetch: 10

 logging:
   level:
     com.cyj.feign.ProductFeignClient: debug