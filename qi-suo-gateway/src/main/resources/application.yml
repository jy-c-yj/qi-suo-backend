server:
  port: 8080


spring:
  application:
    name: qi-suo-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:${spring.profiles.active:dev}}
      config:
        namespace: ${NACOS_NAMESPACE:${spring.profiles.active:dev}}
        group: DEFAULT_GROUP
        file-extension: yaml
  config:
    import:
      - nacos:qi-suo-common.yaml
      - nacos:${spring.application.name}.yaml

