server:
  port: 8080


spring:
  application:
    name: qi-suo-gateway

  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
    gateway:
      routes:
        - id: auth-route
          uri: lb://qi-suo-auth
          predicates:
            - Path=/api/auth/**
        - id: user-route
          uri: lb://qi-suo-user
          predicates:
            - Path=/api/user/**
        - id: admin-route
          uri: lb://qi-suo-admin
          predicates:
            - Path=/api/admin/**
        - id: merchant-route
          uri: lb://qi-suo-merchant
          predicates:
            - Path=/api/merchant/**
        - id: file-route
          uri: lb://qi-suo-file
          predicates:
            - Path=/api/file/**
jwt:
  accessExpire: 86400 # 24小时（秒）
  refreshExpire: 604800 # 7天（秒）
  secret-key: Y6mQMQ+jDKiAp1jwzAqLa7fNp0GzMx54QYpqDIpdZe4=

