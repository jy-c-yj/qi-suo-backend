server:
  port: 8081            # 各服务端口保持本地写死，跟容器 EXPOSE 绑定
spring:
  application:
    name: qi-suo-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:${spring.profiles.active:dev}}
      config:
        namespace: ${NACOS_NAMESPACE:${spring.profiles.active:dev}}
        group: DEFAULT_GROUP
        file-extension: yaml
  config:
    import:
      - nacos:qi-suo-common.yaml
      - nacos:qi-suo-datasource.yaml
      - nacos:${spring.application.name}.yaml



