spring:
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    virtual-host: cyj
    username: cyj
    password: 12345
    #生产者配置
    connection-timeout: 1s #设置MQ连接超时时间
    template:
      retry:
        enabled: true #开启超时重连机制
        initial-interval: 2 #失败后的初始等待时间
        multiplier: 1 #失败后的下次等待时长  ，下次等待时长： initial-interval + multiplier
        max-attempts: 3 #最大重试次数
      mandatory: true
    #生产者配置 监听者配置
    listener:
      simple:
        prefetch: 1
        retry:
          enabled: true #开启重试
          multiplier: 1 #失败后下次等待时间
          initial-interval: 1 #首次失败等待时间
          max-attempts: 3 #最大重试次数
          stateless: false #true为无状态是默认，false为有状态，在业务存在事务时使用false
        acknowledge-mode: auto